name: kudo-mcp CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'kudo/kudo-mcp/**'
      - 'kudo/agents/**'
      - 'kudo/skills/**'
      - 'content/kudo/sgx/politicas-y-procedimientos/**'
      - 'content/kudo/framework/oscal/kudo/**'
      - '.github/workflows/kudo-mcp-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'kudo/kudo-mcp/**'
      - 'kudo/agents/**'
      - 'kudo/skills/**'
      - 'content/kudo/sgx/politicas-y-procedimientos/**'
      - 'content/kudo/framework/oscal/kudo/**'
      - '.github/workflows/kudo-mcp-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kudo/kudo-mcp
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: './kudo/kudo-mcp/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
