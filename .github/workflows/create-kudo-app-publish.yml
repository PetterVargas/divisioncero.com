name: Publish create-kudo-app to npm

on:
  push:
    # En este repo conviven varios proyectos: solo los tags del CLI publican en npm.
    tags:
      - 'create-kudo-app-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kudo/create-kudo-app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Usa la versión de pnpm del campo packageManager del package.json raíz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted Publishing (OIDC): npm valida este workflow con el token de identidad de
      # GitHub (permiso id-token: write), sin NPM_TOKEN. Requiere npm 11.5.1 o superior y
      # configurar el Trusted Publisher del paquete en npmjs.com. La procedencia (provenance)
      # se adjunta automáticamente.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11.6.2

      - name: Publish to npm
        run: npm publish --access public
