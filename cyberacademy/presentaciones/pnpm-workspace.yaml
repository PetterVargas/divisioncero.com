shamefullyHoist: true

# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm blocks unapproved build
# scripts by default, so allowlist it up-front.
onlyBuiltDependencies:
  - playwright-chromium

# Equivalente para pnpm >= 11, que reemplazó `onlyBuiltDependencies` por `allowBuilds`.
allowBuilds:
  playwright-chromium: true

# Versiones parcheadas de dependencias transitivas con avisos de seguridad (pnpm audit).
overrides:
  dompurify: '>=3.4.17'
  katex: '>=0.18.2'
  nanoid@<3.3.18: '^3.3.18'
  fast-uri: '^3.1.9'
  js-yaml@<3.15.2: '^3.15.2'
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  hono: '^4.13.5'
  '@hono/node-server': '^2.1.3'
  image-size: '^2.0.3'
  source-map-js: '^1.2.2'
  markdown-it: '^14.3.2'
  zod@>=4.0.0 <4.6.6: '^4.6.6'
  serialize-javascript: '^7.1.3'
  postcss-selector-parser@>=7.0.0: '^7.1.6'
  brace-expansion@>=2.0.0 <3: '^2.1.7'
  brace-expansion@>=4.0.0 <5.0.12: '^5.0.12'
  '@modelcontextprotocol/server@>=2.0.0 <2.3.0': '^2.3.0'
  '@modelcontextprotocol/node@>=2.0.0 <2.1.0': '^2.1.0'
